<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshot</title>
<style>
  :root { color-scheme: light; --ink: #111; --ink2: #6b6b6b; --line: #e5e5e5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 20px; min-height: 100vh; display: flex; flex-direction: column; }

  header { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; padding: 20px 0 6px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--ink2); font-size: 13px; }

  #cloud { flex: 1; position: relative; min-height: 460px; overflow: hidden; }
  #cloud > span { color: var(--ink2); }
  .word { position: absolute; font: inherit; font-weight: 600; line-height: 1.1; white-space: nowrap; background: none; border: 0; padding: 0 3px; border-radius: 4px; cursor: pointer; transition: color .12s, background .12s; }
  .word:hover, .word:focus-visible, .word[aria-expanded="true"] { color: var(--ink) !important; background: #f0f0f0; outline: none; }

  footer { color: var(--ink2); font-size: 12px; padding-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  footer b { color: #333; font-weight: 600; }

  #pop { position: fixed; z-index: 10; width: 340px; max-width: calc(100vw - 16px); background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 10px 12px; font-size: 13px; }
  #pop[hidden] { display: none; }
  #pop .ph { color: var(--ink2); font-size: 12px; margin-bottom: 6px; }
  #pop .ph b { color: var(--ink); font-size: 15px; margin-right: 8px; }
  #pop ul { list-style: none; margin: 0; padding: 0; }
  #pop li { padding: 5px 0; border-top: 1px solid var(--line); }
  #pop li a { color: var(--ink); text-decoration: none; display: block; overflow-wrap: anywhere; }
  #pop li a:hover { text-decoration: underline; }
  #pop li small { color: var(--ink2); font-size: 12px; display: block; margin-top: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Snapshot</h1>
    <p>Bigger = mentioned more, in more places. Hover for a snapshot, click to pin.</p>
  </header>
  <div id="cloud"><span>Loading…</span></div>
  <footer id="summary"></footer>
</div>

<script>
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : String(n);
const ago = ts => { const m = Math.max(0, (Date.now()/1000 - ts)/60); return m < 60 ? Math.round(m)+'m' : m < 1440 ? Math.round(m/60)+'h' : Math.round(m/1440)+'d'; };
const getJSON = async url => {
  const r = await fetch(url);
  if (!r.ok) {
    // our own backend returns {error: "..."} with a useful message; 503 = not configured
    const body = await r.json().catch(() => null);
    const e = new Error(body?.error || 'HTTP ' + r.status);
    e.status = r.status;
    throw e;
  }
  return r.json();
};

// Each source returns [{title, url, meta, value?}]. value (optional) is the popularity count.
const SOURCES = [
  { id: 'hn', name: 'Hacker News', async load() {
      const ids = (await getJSON('https://hacker-news.firebaseio.com/v0/topstories.json')).slice(0, 20);
      const items = await Promise.all(ids.map(id => getJSON(`https://hacker-news.firebaseio.com/v0/item/${id}.json`)));
      return items.filter(Boolean).map(i => ({ title: i.title, url: i.url || `https://news.ycombinator.com/item?id=${i.id}`, meta: `${i.score} pts · ${ago(i.time)}`, value: i.score }));
  }},
  { id: 'gh', name: 'GitHub', async load() {
      const since = new Date(Date.now() - 7*864e5).toISOString().slice(0, 10);
      const j = await getJSON(`https://api.github.com/search/repositories?q=created:>${since}&sort=stars&order=desc&per_page=20`);
      return j.items.map(r => ({ title: `${r.full_name}${r.description ? ' — ' + r.description : ''}`, url: r.html_url, meta: '★ ' + fmt(r.stargazers_count), value: r.stargazers_count }));
  }},
  // Reddit and X go through server.py (they need credentials the browser must not hold).
  { id: 'reddit', name: 'Reddit', load: () => getJSON('/api/reddit') },
  { id: 'x', name: 'X', load: () => getJSON('/api/x') },
  { id: 'masto', name: 'Mastodon', async load() {
      const j = await getJSON('https://mastodon.social/api/v1/trends/links?limit=20');
      return j.map(l => { const n = l.history.slice(0, 2).reduce((s, d) => s + Number(d.uses), 0); return { title: l.title || l.url, url: l.url, meta: fmt(n) + ' posts', value: n }; });
  }},
  { id: 'bsky', name: 'Bluesky', async load() {
      const j = await getJSON('https://public.api.bsky.app/xrpc/app.bsky.unspecced.getTrendingTopics?limit=20');
      return j.topics.map(t => ({ title: t.topic, url: t.link.startsWith('http') ? t.link : 'https://bsky.app' + t.link, meta: '' }));
  }},
  { id: 'wiki', name: 'Wikipedia', async load() {
      const d = new Date(Date.now() - 864e5);
      const p = n => String(n).padStart(2, '0');
      const j = await getJSON(`https://wikimedia.org/api/rest_v1/metrics/pageviews/top/en.wikipedia/all-access/${d.getUTCFullYear()}/${p(d.getUTCMonth()+1)}/${p(d.getUTCDate())}`);
      return j.items[0].articles.filter(a => !/^(Main_Page|Special:|Wikipedia:|Portal:|-)/.test(a.article)).slice(0, 20)
        .map(a => ({ title: a.article.replace(/_/g, ' '), url: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(a.article), meta: fmt(a.views) + ' views', value: a.views }));
  }},
];

// ---- word cloud: pull terms out of every feed's headlines, weight by popularity
const STATE = {};    // latest items per source id (kept when a refresh fails)
const STATUS = {};   // 'ok' | 'setup' | 'err' per source id
const STOP = new Set(`a an the and or but if of to in on at by for with from as into over under about after before up down out off than then so not no nor too very can could should would will just is are was were be been being am do does did done has have had having it its this that these those there here they them their he she his her we our you your i me my who whom what which when where why how also more most new says say said see get gets got make makes made via per vs amid one two first last still now today yesterday week year years time like back announces announce adds add using use used full free best top open built build let lets all any some every each both few many much other another such own same only even ever never always already again further while during against between through run runs running bring brings complete setup feature features installer tool tools report reports live star stars desktop standalone pre-configured preconfigured going go goes take takes come comes want wants need needs know knows think thinks set part found working next inside analysis heading him promised alive dead secure suite trainer editor studio backups delta executive relationship care found working part minutes needed answers wrong featuring global deal device presets re-release anniversary`.split(/\s+/));
const ACRONYMS = new Set(['AI', 'US', 'UK', 'EU', 'UN', 'VA', 'TV', 'PC', 'AR', 'VR', 'EV', 'FBI', 'CIA', 'NASA', 'GPU', 'CPU', 'IPO']);
const tokenize = s => (s.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || [])
  .filter(t => !/[぀-ヿ㐀-鿿]/.test(t))
  .map(t => t.replace(/['’]s$/i, '').replace(/['’-]+$/, ''));
const termOk = (raw, key) => !STOP.has(key) && !/^\d+$/.test(key) &&
  ((raw.length >= 3 && raw.length <= 24) || ACRONYMS.has(raw));   // 2-letter words only if known acronyms
const SRC_NAME = Object.fromEntries(SOURCES.map(s => [s.id, s.name]));

// ---- hover / pin snapshot
const pop = document.createElement('div');
pop.id = 'pop'; pop.hidden = true;
document.body.appendChild(pop);
let hideTimer = null, pinned = null;

function hidePop(force) {
  if (pinned && !force) return;
  pop.hidden = true;
  document.querySelectorAll('.word[aria-expanded="true"]').forEach(w => w.setAttribute('aria-expanded', 'false'));
}
function showPop(t, el) {
  clearTimeout(hideTimer);
  document.querySelectorAll('.word[aria-expanded="true"]').forEach(w => w.setAttribute('aria-expanded', 'false'));
  el.setAttribute('aria-expanded', 'true');
  pop.replaceChildren();
  const head = document.createElement('div'); head.className = 'ph';
  const b = document.createElement('b'); b.textContent = t.label;
  head.append(b, `${t.items.length} mentions · ${t.sources.size} source${t.sources.size > 1 ? 's' : ''}`);
  const ul = document.createElement('ul');
  for (const { it, id } of t.items.slice(0, 5)) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.textContent = it.title; a.href = it.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    const sm = document.createElement('small');
    sm.textContent = SRC_NAME[id] + (it.meta ? ' · ' + it.meta : '');
    li.append(a, sm); ul.appendChild(li);
  }
  pop.append(head, ul);
  pop.hidden = false;
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  const x = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, innerWidth - pw - 8));
  let y = r.bottom + 6;
  if (y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 6);
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}
const scheduleHide = () => { clearTimeout(hideTimer); hideTimer = setTimeout(() => hidePop(), 150); };
pop.addEventListener('mouseenter', () => clearTimeout(hideTimer));
pop.addEventListener('mouseleave', scheduleHide);
document.addEventListener('click', e => { if (!pop.contains(e.target)) { pinned = null; hidePop(true); } });
addEventListener('scroll', () => { pinned = null; hidePop(true); }, { passive: true });

// ---- score terms
let lastList = [];
function buildCloud() {
  if (!pop.hidden) return;               // don't yank the cloud out from under a hover
  const terms = new Map();
  for (const s of SOURCES) {
    const items = STATE[s.id];
    if (!items) continue;
    const max = Math.max(0, ...items.map(i => i.value || 0));
    items.forEach((it, idx) => {
      // an item's pull: share of the feed's biggest value, or its rank when the feed has no counts
      const w = 0.35 + 0.65 * (max > 0 && it.value ? it.value / max : 1 - idx / items.length);
      const seen = new Set();
      for (const raw of tokenize(it.title)) {
        const key = raw.toLowerCase();
        if (seen.has(key) || !termOk(raw, key)) continue;
        seen.add(key);
        let t = terms.get(key);
        if (!t) terms.set(key, t = { key, label: raw, score: 0, best: 0, items: [], sources: new Set() });
        if (/^\p{Lu}/u.test(raw) && !/^\p{Lu}/u.test(t.label)) t.label = raw;
        t.score += w; t.best = Math.max(t.best, w);
        t.items.push({ it, id: s.id, w }); t.sources.add(s.id);
      }
    });
  }
  // keep anything seen twice, or a word from a feed's stronger stories; boost by spread
  let list = [...terms.values()].filter(t => t.items.length >= 2 || t.best >= 0.85);
  for (const t of list) { t.score *= 1 + 0.5 * (t.sources.size - 1); t.items.sort((a, b) => b.w - a.w); }
  list.sort((a, b) => b.score - a.score);
  list = list.slice(0, 90);
  // fuse neighbours that always appear together ("Jensen" + "Huang" -> "Jensen Huang")
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      if (a.items.length < 2 || a.items.length !== b.items.length) continue;   // only fuse pairs seen in 2+ stories
      const pair = (x, y) => a.items.every(({ it }) => it.title.toLowerCase().includes(`${x.key} ${y.key}`));
      const first = pair(a, b) ? a : pair(b, a) ? b : null;
      if (!first) continue;
      a.label = first === a ? `${a.label} ${b.label}` : `${b.label} ${a.label}`;
      a.key = first === a ? `${a.key} ${b.key}` : `${b.key} ${a.key}`;
      list.splice(j, 1); j--;
    }
  }
  lastList = list.slice(0, 70);
  drawCloud();
}

// ---- pack words into a tight cluster: biggest first, spiral out from the centre until a spot is free
function drawCloud() {
  const cloud = document.getElementById('cloud');
  if (!lastList.length) return;
  const W = cloud.clientWidth, H = cloud.clientHeight;
  const k = Math.min(1.2, Math.max(0.65, W / 1000));
  const top = lastList[0].score;
  const els = lastList.map(t => {
    const r = Math.pow(t.score / top, 0.85);
    const el = document.createElement('button');
    el.className = 'word'; el.type = 'button'; el.textContent = t.label;
    el.setAttribute('aria-expanded', 'false');
    el.style.fontSize = ((12 + 62 * r) * k).toFixed(1) + 'px';
    el.style.color = `hsl(0 0% ${(52 - 30 * r).toFixed(0)}%)`;   // bigger = darker gray
    el.style.visibility = 'hidden';
    el.addEventListener('mouseenter', () => { if (!pinned || pinned === el) showPop(t, el); });
    el.addEventListener('focus', () => { if (!pinned) showPop(t, el); });
    el.addEventListener('mouseleave', scheduleHide);
    el.addEventListener('blur', scheduleHide);
    el.addEventListener('click', e => {
      e.stopPropagation();
      pinned = pinned === el ? null : el;
      if (pinned) showPop(t, el); else hidePop(true);
    });
    return el;
  });
  cloud.replaceChildren(...els);               // attach so we can measure
  const aspect = Math.max(1, Math.min(2.4, W / H));
  const gap = 4, placed = [];
  for (const el of els) {
    const w = el.offsetWidth + gap * 2, h = el.offsetHeight + gap * 2;
    let spot = null;
    for (let i = 0; i < 9000 && !spot; i++) {
      const th = i * 0.07, r = 1.5 * th;
      const x = W / 2 + r * Math.cos(th) * aspect - w / 2, y = H / 2 + r * Math.sin(th) - h / 2;
      if (x < 0 || y < 0 || x + w > W || y + h > H) continue;
      if (placed.some(p => x < p.x + p.w && x + w > p.x && y < p.y + p.h && y + h > p.y)) continue;
      spot = { el, x, y, w, h };
    }
    if (spot) placed.push(spot); else el.remove();   // no room left: drop the smallest words
  }
  // re-centre the finished cluster
  const minX = Math.min(...placed.map(p => p.x)), maxX = Math.max(...placed.map(p => p.x + p.w));
  const minY = Math.min(...placed.map(p => p.y)), maxY = Math.max(...placed.map(p => p.y + p.h));
  const dx = (W - (maxX - minX)) / 2 - minX, dy = (H - (maxY - minY)) / 2 - minY;
  for (const p of placed) {
    p.el.style.left = (p.x + dx + gap).toFixed(1) + 'px';
    p.el.style.top = (p.y + dy + gap).toFixed(1) + 'px';
    p.el.style.visibility = 'visible';
  }
}
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (pop.hidden) drawCloud(); }, 200); });

function summarize() {
  const names = st => SOURCES.filter(s => STATUS[s.id] === st).map(s => s.name);
  const live = names('ok'), setup = names('setup'), broken = names('err');
  const f = document.getElementById('summary');
  f.replaceChildren();
  const add = (strong, rest) => { const sp = document.createElement('span'); const b = document.createElement('b'); b.textContent = strong; sp.append(b, ' ' + rest); f.appendChild(sp); };
  add(String(live.length), 'sources live');
  if (setup.length) add(setup.join(', '), 'need setup');
  if (broken.length) add(broken.join(', '), 'failing');
  add('Updated', new Date().toLocaleTimeString() + ' · every 60s');
}

async function refresh() {
  await Promise.all(SOURCES.map(s => s.load()
    .then(items => { STATE[s.id] = items; STATUS[s.id] = 'ok'; })
    .catch(e => { STATUS[s.id] = e.status === 503 ? 'setup' : 'err'; })));   // stale items stay in STATE
  summarize();
  buildCloud();
}
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
