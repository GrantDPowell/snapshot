<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Inter+Tight:wght@500..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --ink: #111; --ink2: #6f6f6f; --ink3: #a8a8a8; --line: #ececec;
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 13px/1.45 var(--ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; padding: 22px 0 0; }
  .brand { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
  h1 { margin: 0; font: 600 17px/1 var(--display); letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  h1::before { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 3px solid var(--ink); }
  .brand p { margin: 0; color: var(--ink2); }
  .status { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); }
  .status.live i { background: var(--ink); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(17,17,17,.35); } 70%, 100% { box-shadow: 0 0 0 7px rgba(17,17,17,0); } }

  #cloud { flex: 1; position: relative; min-height: 420px; overflow: hidden; }
  #layer { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transition: transform .7s var(--ease); }
  .msg { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; text-align: center; color: var(--ink3); font: 500 15px var(--display); animation: breathe 1.6s ease-in-out infinite alternate; }
  .msg[hidden] { display: none; }
  @keyframes breathe { to { opacity: .45; } }
  .word { position: absolute; left: 0; top: 0; margin: 0; padding: 0 .08em; background: none; border: 0; border-radius: 6px; cursor: pointer;
    font-family: var(--display); line-height: 1.05; white-space: nowrap; color: var(--c); -webkit-tap-highlight-color: transparent;
    transition: transform .7s var(--ease), opacity .25s, color .15s; animation: word-in .6s var(--ease) backwards; }
  .word.new { transition: none; }
  .word.out { opacity: 0; pointer-events: none; }
  .word:hover, .word:focus-visible, .word[aria-expanded="true"] { color: var(--ch, var(--ink)); outline: none; }
  .word:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  #cloud.focus .word:not([aria-expanded="true"]):not(.rel) { opacity: .22; color: var(--cd, var(--c)); }
  @keyframes word-in { from { opacity: 0; scale: .92; filter: blur(3px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; padding: 12px 0 20px; color: var(--ink2); font-size: 12px; }
  #sources { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; }
  #sources li { display: flex; align-items: center; gap: 6px; }
  #sources li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  #sources li:not(.ok) { color: var(--ink3); }
  #sources li:not(.ok)::before { background: none; border: 1px solid var(--ink3); }
  #sources li.err { text-decoration: line-through; }
  .hint { margin: 0; color: var(--ink3); }

  #pop { position: fixed; z-index: 10; width: 360px; max-width: calc(100vw - 16px); background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 16px 44px -10px rgba(0,0,0,.2); padding: 14px 8px 8px; animation: pop-in .16s var(--ease); }
  #pop[hidden] { display: none; }
  #pop.pinned { border-color: rgba(0,0,0,.22); }
  @keyframes pop-in { from { opacity: 0; translate: 0 4px; } }
  #pop .ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 8px 8px; color: var(--ink2); font-size: 12px; white-space: nowrap; }
  #pop .ph b { color: var(--ink); font: 600 18px/1.2 var(--display); letter-spacing: -.02em; white-space: normal; overflow-wrap: anywhere; }
  #pop ul { list-style: none; margin: 0; padding: 0; }
  #pop li a { display: block; padding: 7px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; transition: background .12s; }
  #pop li a:hover, #pop li a:focus-visible { background: #f5f5f5; outline: none; }
  #pop li span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; line-height: 1.35; }
  #pop li small { display: block; margin-top: 3px; color: var(--ink2); font-size: 11px; }
  #pop li small b { font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: 10px; }
  #pop .more { padding: 6px 8px 4px; color: var(--ink3); font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Snapshot</h1>
      <p>What the internet is talking about, right now</p>
    </div>
    <div id="status" class="status" role="status"><i></i><span>Connecting…</span></div>
  </header>
  <div id="cloud"><div id="layer"></div><p id="msg" class="msg">Gathering headlines…</p></div>
  <footer>
    <ul id="sources" aria-label="Sources"></ul>
    <p class="hint">Bigger and darker = mentioned more, in more places · orange = newer · hover a word to see related ones, click for its stories</p>
  </footer>
</div>

<script>
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : String(n);
const ago = ts => { const m = Math.max(0, (Date.now()/1000 - ts)/60); return m < 60 ? Math.round(m)+'m' : m < 1440 ? Math.round(m/60)+'h' : Math.round(m/1440)+'d'; };
const getJSON = async url => {
  const r = await fetch(url);
  if (!r.ok) {
    // our own backend returns {error: "..."} with a useful message; 503 = not configured
    const body = await r.json().catch(() => null);
    const e = new Error(body?.error || 'HTTP ' + r.status);
    e.status = r.status;
    throw e;
  }
  return r.json();
};

// Each source returns [{title, url, meta, value?}]. value (optional) is the popularity count.
const SOURCES = [
  { id: 'hn', name: 'Hacker News', async load() {
      const ids = (await getJSON('https://hacker-news.firebaseio.com/v0/topstories.json')).slice(0, 20);
      const items = await Promise.all(ids.map(id => getJSON(`https://hacker-news.firebaseio.com/v0/item/${id}.json`)));
      return items.filter(Boolean).map(i => ({ title: i.title, url: i.url || `https://news.ycombinator.com/item?id=${i.id}`, meta: `${i.score} pts · ${ago(i.time)}`, value: i.score, time: i.time }));
  }},
  { id: 'gh', name: 'GitHub', async load() {
      const since = new Date(Date.now() - 7*864e5).toISOString().slice(0, 10);
      const j = await getJSON(`https://api.github.com/search/repositories?q=created:>${since}&sort=stars&order=desc&per_page=20`);
      return j.items.map(r => ({ title: `${r.full_name}${r.description ? ' — ' + r.description : ''}`, url: r.html_url, meta: '★ ' + fmt(r.stargazers_count), value: r.stargazers_count, time: Date.parse(r.created_at) / 1000 }));
  }},
  // Reddit and X go through server.py (they need credentials the browser must not hold).
  { id: 'reddit', name: 'Reddit', load: () => getJSON('/api/reddit') },
  { id: 'x', name: 'X', load: () => getJSON('/api/x') },
  { id: 'masto', name: 'Mastodon', async load() {
      const j = await getJSON('https://mastodon.social/api/v1/trends/links?limit=20');
      return j.map(l => { const n = l.history.slice(0, 2).reduce((s, d) => s + Number(d.uses), 0); return { title: l.title || l.url, url: l.url, meta: fmt(n) + ' posts', value: n }; });
  }},
  { id: 'bsky', name: 'Bluesky', async load() {
      const j = await getJSON('https://public.api.bsky.app/xrpc/app.bsky.unspecced.getTrendingTopics?limit=20');
      return j.topics.map(t => ({ title: t.topic, url: t.link.startsWith('http') ? t.link : 'https://bsky.app' + t.link, meta: '' }));
  }},
  { id: 'wiki', name: 'Wikipedia', async load() {
      const d = new Date(Date.now() - 864e5);
      const p = n => String(n).padStart(2, '0');
      const j = await getJSON(`https://wikimedia.org/api/rest_v1/metrics/pageviews/top/en.wikipedia/all-access/${d.getUTCFullYear()}/${p(d.getUTCMonth()+1)}/${p(d.getUTCDate())}`);
      return j.items[0].articles.filter(a => !/^(Main_Page|Special:|Wikipedia:|Portal:|-)/.test(a.article)).slice(0, 20)
        .map(a => ({ title: a.article.replace(/_/g, ' '), url: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(a.article), meta: fmt(a.views) + ' views', value: a.views }));
  }},
];

// ---- word cloud: pull terms out of every feed's headlines, weight by popularity
const STATE = {};    // latest items per source id (kept when a refresh fails)
const STATUS = {};   // 'ok' | 'setup' | 'err' per source id
const WHY = {};      // why a source isn't live, for its tooltip
const STOP = new Set(`a an the and or but if of to in on at by for with from as into over under about after before up down out off than then so not no nor too very can could should would will just is are was were be been being am do does did done has have had having it its this that these those there here they them their he she his her we our you your i me my who whom what which when where why how also more most new says say said see get gets got make makes made via per vs amid one two first last still now today yesterday week year years time like back announces announce adds add using use used full free best top open built build let lets all any some every each both few many much other another such own same only even ever never always already again further while during against between through run runs running bring brings complete setup feature features installer tool tools report reports live star stars desktop standalone pre-configured preconfigured going go goes take takes come comes want wants need needs know knows think thinks set part found working next inside analysis heading him promised alive dead secure suite trainer editor studio backups delta executive relationship care found working part minutes needed answers wrong featuring global deal device presets re-release anniversary`.split(/\s+/));
const ACRONYMS = new Set(['AI', 'US', 'UK', 'EU', 'UN', 'VA', 'TV', 'PC', 'AR', 'VR', 'EV', 'FBI', 'CIA', 'NASA', 'GPU', 'CPU', 'IPO']);
const tokenize = s => (s.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || [])
  .filter(t => !/[぀-ヿ㐀-鿿]/.test(t))
  .map(t => t.replace(/['’]s$/i, '').replace(/['’-]+$/, ''));
const termOk = (raw, key) => !STOP.has(key) && !/^\d+$/.test(key) &&
  ((raw.length >= 3 && raw.length <= 24) || ACRONYMS.has(raw));   // 2-letter words only if known acronyms
const SRC_NAME = Object.fromEntries(SOURCES.map(s => [s.id, s.name]));

// ---- hover / pin snapshot
const pop = document.createElement('div');
pop.id = 'pop'; pop.hidden = true;
document.body.appendChild(pop);
let hideTimer = null, pinned = null;

function hidePop(force) {
  if (pinned && !force) return;
  pop.hidden = true;
  document.getElementById('cloud').classList.remove('focus');
  document.querySelectorAll('.word[aria-expanded="true"]').forEach(w => w.setAttribute('aria-expanded', 'false'));
}
// fade the rest of the cloud, keeping words that share a story with this one
function setFocus(t) {
  const stories = new Set(t.items.map(x => x.it));
  for (const w of WORDS.values()) w.classList.toggle('rel', w._t.items.some(x => stories.has(x.it)));
  document.getElementById('cloud').classList.add('focus');
}
// hover ends: back to the open card's words, or the plain cloud
function restoreFocus() {
  const open = document.querySelector('.word[aria-expanded="true"]');
  if (open && !pop.hidden) setFocus(open._t);
  else document.getElementById('cloud').classList.remove('focus');
}
function showPop(t, el) {
  clearTimeout(hideTimer);
  document.querySelectorAll('.word[aria-expanded="true"]').forEach(w => w.setAttribute('aria-expanded', 'false'));
  el.setAttribute('aria-expanded', 'true');
  setFocus(t);
  pop.replaceChildren();
  const n = t.items.length, shown = t.items.slice(0, 5);
  const head = document.createElement('div'); head.className = 'ph';
  const b = document.createElement('b'); b.textContent = t.label;
  const count = document.createElement('span');
  count.textContent = `${n} mention${n > 1 ? 's' : ''} · ${t.sources.size} source${t.sources.size > 1 ? 's' : ''}`;
  head.append(b, count);
  const ul = document.createElement('ul');
  for (const { it, id } of shown) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = it.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    const title = document.createElement('span'); title.textContent = it.title;
    const sm = document.createElement('small');
    const src = document.createElement('b'); src.textContent = SRC_NAME[id];
    sm.append(src, it.meta ? ' · ' + it.meta : '');
    a.append(title, sm); li.appendChild(a); ul.appendChild(li);
  }
  pop.append(head, ul);
  if (n > shown.length) { const more = document.createElement('div'); more.className = 'more'; more.textContent = `+ ${n - shown.length} more`; pop.appendChild(more); }
  pop.classList.toggle('pinned', pinned === el);
  pop.hidden = false;
  placePop(el);
}
function placePop(el) {
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  const x = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, innerWidth - pw - 8));
  let y = r.bottom + 8;
  if (y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 8);
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}
document.addEventListener('click', e => { if (!pop.contains(e.target)) { pinned = null; hidePop(true); } });
addEventListener('scroll', () => { pinned = null; hidePop(true); }, { passive: true });
// a word can still be gliding when its card opens: follow it once it lands
document.getElementById('layer').addEventListener('transitionend', e => {
  if (e.propertyName !== 'transform' || pop.hidden) return;
  const open = document.querySelector('.word[aria-expanded="true"]');
  if (open) placePop(open);
});

// ---- score terms
let lastList = [];
function buildCloud() {
  if (!pop.hidden) return;               // don't yank the cloud out from under a hover
  const terms = new Map();
  for (const s of SOURCES) {
    const items = STATE[s.id];
    if (!items) continue;
    const max = Math.max(0, ...items.map(i => i.value || 0));
    items.forEach((it, idx) => {
      // an item's pull: share of the feed's biggest value, or its rank when the feed has no counts
      const w = 0.35 + 0.65 * (max > 0 && it.value ? it.value / max : 1 - idx / items.length);
      const seen = new Set();
      for (const raw of tokenize(it.title)) {
        const key = raw.toLowerCase();
        if (seen.has(key) || !termOk(raw, key)) continue;
        seen.add(key);
        let t = terms.get(key);
        if (!t) terms.set(key, t = { key, label: raw, score: 0, best: 0, items: [], sources: new Set() });
        if (/^\p{Lu}/u.test(raw) && !/^\p{Lu}/u.test(t.label)) t.label = raw;
        t.score += w; t.best = Math.max(t.best, w);
        t.items.push({ it, id: s.id, w }); t.sources.add(s.id);
      }
    });
  }
  // keep anything seen twice, or a word from a feed's stronger stories; boost by spread
  let list = [...terms.values()].filter(t => t.items.length >= 2 || t.best >= 0.85);
  for (const t of list) { t.score *= 1 + 0.5 * (t.sources.size - 1); t.items.sort((a, b) => b.w - a.w); }
  list.sort((a, b) => b.score - a.score);
  list = list.slice(0, 90);
  // fuse neighbours that always appear together ("Jensen" + "Huang" -> "Jensen Huang")
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      if (a.items.length < 2 || a.items.length !== b.items.length) continue;   // only fuse pairs seen in 2+ stories
      const pair = (x, y) => a.items.every(({ it }) => it.title.toLowerCase().includes(`${x.key} ${y.key}`));
      const first = pair(a, b) ? a : pair(b, a) ? b : null;
      if (!first) continue;
      a.label = first === a ? `${a.label} ${b.label}` : `${b.label} ${a.label}`;
      a.key = first === a ? `${a.key} ${b.key}` : `${b.key} ${a.key}`;
      list.splice(j, 1); j--;
    }
  }
  lastList = list.slice(0, 70);
  drawCloud();
}

// ---- pack words into a tight cluster: biggest first, spiral out from the centre until a spot is free,
// then scale the whole cluster to fill the space. Words are kept between draws so they glide, not jump.
const WORDS = new Map();   // term key -> its button
function wordEl(t) {
  const el = document.createElement('button');
  el.className = 'word new'; el.type = 'button';
  el.setAttribute('aria-expanded', 'false');
  el.addEventListener('mouseenter', () => setFocus(el._t));
  el.addEventListener('mouseleave', restoreFocus);
  el.addEventListener('click', e => {
    e.stopPropagation();
    pinned = pinned === el ? null : el;
    if (pinned) showPop(el._t, el); else hidePop(true);
  });
  return el;
}
function drawCloud() {
  const cloud = document.getElementById('cloud'), layer = document.getElementById('layer');
  const W = cloud.clientWidth, H = cloud.clientHeight;
  const narrow = W < 600;
  const list = lastList.slice(0, narrow ? 40 : 70);
  if (!list.length) return;
  document.getElementById('msg').hidden = true;

  const keep = new Set(list.map(t => t.key));
  for (const [key, el] of WORDS) {
    if (keep.has(key)) continue;
    WORDS.delete(key); el.classList.add('out'); setTimeout(() => el.remove(), 300);
  }
  const first = WORDS.size === 0, top = list[0].score;
  const els = list.map((t, i) => {
    let el = WORDS.get(t.key);
    if (!el) { WORDS.set(t.key, el = wordEl(t)); el.style.animationDelay = (first ? i * 12 : 0) + 'ms'; layer.appendChild(el); }
    const r = Math.pow(t.score / top, 0.85);
    el._t = t; el.textContent = t.label;
    el.style.fontSize = (narrow ? 18 + 40 * r : 13 + 64 * r).toFixed(1) + 'px';   // flatter range on phones, so the top word doesn't shrink the rest
    el.style.fontWeight = Math.round(500 + 100 * r);
    el.style.letterSpacing = (-0.005 - 0.03 * r).toFixed(3) + 'em';
    // newer = more orange: full colour for stories under ~2h old, fading to plain gray by a day.
    // Feeds with no timestamps (Mastodon, Bluesky, Wikipedia, X) just stay gray.
    const newest = Math.max(0, ...t.items.map(x => x.it.time || 0));
    const hrs = (Date.now() / 1000 - newest) / 3600;
    const fresh = newest ? Math.max(0, Math.min(1, 1 - (hrs - 2) / 22)) : 0;
    const light = 67 - 23 * Math.sqrt(r);                  // bigger = darker, never near black
    el.style.setProperty('--c', `hsl(24 ${(42 * fresh).toFixed(0)}% ${light.toFixed(0)}%)`);
    // not related to the hovered word: an even lighter orange (on top of the fade)
    el.style.setProperty('--cd', `hsl(24 ${(50 * fresh).toFixed(0)}% ${(light + 12 * fresh).toFixed(0)}%)`);
    // hovered / open: a deep orange for new words, near-black for the rest
    el.style.setProperty('--ch', `hsl(24 ${(75 * fresh).toFixed(0)}% ${(7 + 25 * fresh).toFixed(0)}%)`);
    return el;
  });

  const aspect = Math.max(0.5, Math.min(2.4, W / H));
  const gx = 5, gy = 2, placed = [];
  for (const el of els) {
    const w = el.offsetWidth + gx * 2, h = el.offsetHeight + gy * 2;
    for (let i = 0; i < 20000; i++) {
      const th = i * 0.07, r = 1.5 * th;
      const x = r * Math.cos(th) * aspect - w / 2, y = r * Math.sin(th) - h / 2;
      if (placed.some(p => x < p.x + p.w && x + w > p.x && y < p.y + p.h && y + h > p.y)) continue;
      placed.push({ el, x, y, w, h });
      break;
    }
  }
  // centre the finished cluster on the layer's origin and scale it to fit
  const minX = Math.min(...placed.map(p => p.x)), maxX = Math.max(...placed.map(p => p.x + p.w));
  const minY = Math.min(...placed.map(p => p.y)), maxY = Math.max(...placed.map(p => p.y + p.h));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const fit = Math.min(1.5, (W - 16) / (maxX - minX), (H - 16) / (maxY - minY));
  if (first) layer.style.transition = 'none';          // the first draw appears at its final scale
  layer.style.transform = `scale(${fit.toFixed(3)})`;
  for (const p of placed) p.el.style.transform = `translate(${(p.x - cx + gx).toFixed(1)}px, ${(p.y - cy + gy).toFixed(1)}px)`;
  layer.offsetWidth;                                   // new words start in place; only existing ones glide
  for (const el of els) el.classList.remove('new');
  layer.style.transition = '';
}
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (pop.hidden) drawCloud(); }, 200); });

const LABEL = { ok: 'Live', setup: 'Needs setup', err: 'Failing' };
function summarize() {
  const lis = SOURCES.map(s => {
    const st = STATUS[s.id], li = document.createElement('li');
    li.textContent = s.name;
    if (st) { li.className = st; li.title = LABEL[st] + (st !== 'ok' && WHY[s.id] ? ' — ' + WHY[s.id] : ''); }
    return li;
  });
  document.getElementById('sources').replaceChildren(...lis);
  if (!Object.keys(STATUS).length) return;   // nothing loaded yet
  const live = SOURCES.filter(s => STATUS[s.id] === 'ok').length;
  const status = document.getElementById('status');
  status.classList.toggle('live', live > 0);
  status.lastElementChild.textContent = live
    ? `Live · updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
    : 'No sources reachable · retrying';
}
summarize();

const fontReady = Promise.race([
  document.fonts.load('600 20px "Inter Tight"').catch(() => {}),
  new Promise(r => setTimeout(r, 1500)),
]);
document.fonts.addEventListener('loadingdone', () => { if (pop.hidden) drawCloud(); });

async function refresh() {
  await Promise.all(SOURCES.map(s => s.load()
    .then(items => { STATE[s.id] = items; STATUS[s.id] = 'ok'; })
    .catch(e => { STATUS[s.id] = e.status === 503 ? 'setup' : 'err'; WHY[s.id] = e.message; })));   // stale items stay in STATE
  await fontReady;
  summarize();
  buildCloud();
  if (!lastList.length) document.getElementById('msg').textContent = 'Nothing to show yet · retrying in a minute';
}
refresh();
setInterval(refresh, 60000);
</script>
